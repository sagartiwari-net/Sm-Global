<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Finder | Details</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar"></aside>

        <div class="main-panel">
            <header class="topbar">
                <button type="button" class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
                <div class="topbar-text">
                    <h1>Recipe Details</h1>

                </div>
            </header>

            <main class="content">
                <div id="recipeDetail"></div>
            </main>
        </div>
    </div>

    <div class="sidebar-overlay hidden" id="sidebarOverlay"></div>

    <script type="module" src="js/details.js"></script>
</body>
</html>
