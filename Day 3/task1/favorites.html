<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Finder | Favorites</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar"></aside>

        <div class="main-panel">
            <header class="topbar">
                <button type="button" class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
                <div class="topbar-text">
                    <h1>Favorites</h1>
                    <p class="muted">Saved recipes for later</p>
                </div>
            </header>

            <main class="content">
                <div id="emptyFavorites" class="state-box empty-state hidden">
                    <div class="empty-icon">♡</div>
                    <h3>No favorites yet</h3>
                    <p>Save recipes from Discover to see them here.</p>
                    <a href="index.html" class="btn btn-primary">Browse Recipes</a>
                </div>
                <section id="favoritesGrid" class="recipe-grid"></section>
            </main>
        </div>
    </div>

    <div class="sidebar-overlay hidden" id="sidebarOverlay"></div>

    <script type="module" src="js/favorites.js"></script>
</body>
</html>
