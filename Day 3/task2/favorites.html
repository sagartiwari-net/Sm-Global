<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Explorer | Favorites</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar"></aside>

        <div class="main-panel">
            <header class="topbar">
                <button type="button" class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
                <div class="topbar-text">
                    <h1 id="pageTitle">My Favorites</h1>
                    <p id="resultsText" class="muted">Your saved movies</p>
                </div>
            </header>

            <main class="content">
                <section id="movieGrid" class="movie-grid"></section>
            </main>
        </div>
    </div>

    <div class="sidebar-overlay hidden" id="sidebarOverlay"></div>

    <script type="module" src="js/favorites-page.js"></script>
</body>
</html>
