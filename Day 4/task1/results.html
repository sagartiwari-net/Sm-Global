<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Search Results | redBus</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="results-page">

    <!-- ============ NAVBAR ============ -->
    <nav class="navbar navbar-expand-lg fixed-top navbar-custom scrolled" id="mainNav">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-bus-front-fill"></i> red<span>Bus</span>
            </a>
            <div class="ms-auto d-flex align-items-center gap-2">
                <a class="btn btn-outline-light btn-sm px-3" href="index.html"><i class="bi bi-house"></i> Home</a>
                <a class="btn btn-outline-light btn-sm px-3" href="account.html"><i class="bi bi-ticket-perforated"></i> My Bookings</a>
                <span data-auth-nav></span>
            </div>
        </div>
    </nav>

    <!-- ============ SEARCH SUMMARY BAR ============ -->
    <section class="search-bar-strip">
        <div class="container">
            <form id="modifyForm" class="row g-2 align-items-end">
                <div class="col-6 col-lg-3">
                    <label class="form-label"><i class="bi bi-geo-alt-fill text-danger"></i> From</label>
                    <input type="text" class="form-control" id="fromCity" list="cityList" required>
                </div>
                <div class="col-6 col-lg-3">
                    <label class="form-label"><i class="bi bi-geo-alt-fill text-danger"></i> To</label>
                    <input type="text" class="form-control" id="toCity" list="cityList" required>
                </div>
                <div class="col-8 col-lg-3">
                    <label class="form-label"><i class="bi bi-calendar-event-fill text-danger"></i> Date</label>
                    <input type="date" class="form-control" id="journeyDate" required>
                </div>
                <div class="col-4 col-lg-3 d-grid">
                    <button type="submit" class="btn btn-search"><i class="bi bi-search"></i> Modify</button>
                </div>
                <datalist id="cityList">
                    <option value="Delhi"></option><option value="Mumbai"></option>
                    <option value="Bangalore"></option><option value="Hyderabad"></option>
                    <option value="Chennai"></option><option value="Pune"></option>
                    <option value="Kolkata"></option><option value="Goa"></option>
                    <option value="Jaipur"></option><option value="Manali"></option>
                    <option value="Shimla"></option><option value="Rishikesh"></option>
                </datalist>
            </form>
        </div>
    </section>

    <!-- ============ RESULTS ============ -->
    <main class="results-main">
        <div class="container">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
                <div>
                    <h1 class="results-title mb-0" id="routeHeading">Buses</h1>
                    <p class="text-muted mb-0" id="resultsMeta">Loading buses...</p>
                </div>
                <button class="btn btn-outline-danger btn-sm d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#filterCanvas">
                    <i class="bi bi-funnel"></i> Filters
                </button>
            </div>

            <div class="row g-4">
                <!-- Filters (desktop) -->
                <aside class="col-lg-3 d-none d-lg-block">
                    <div class="filter-panel" id="filterPanelDesktop"></div>
                </aside>

                <!-- Bus list -->
                <div class="col-lg-9">
                    <!-- Sort bar -->
                    <div class="sort-bar mb-3">
                        <span class="sort-label"><i class="bi bi-sort-down"></i> Sort by:</span>
                        <div class="btn-group flex-wrap" role="group" id="sortGroup">
                            <button class="btn btn-sort active" data-sort="departure">Departure</button>
                            <button class="btn btn-sort" data-sort="price">Price</button>
                            <button class="btn btn-sort" data-sort="duration">Duration</button>
                            <button class="btn btn-sort" data-sort="rating">Rating</button>
                            <button class="btn btn-sort" data-sort="seats">Seats</button>
                        </div>
                    </div>

                    <div id="busList" class="bus-list"></div>

                    <!-- No results -->
                    <div id="noResults" class="no-results d-none">
                        <i class="bi bi-emoji-frown"></i>
                        <h4>No Buses Found</h4>
                        <p class="text-muted">Try changing your filters or search a different route.</p>
                        <button class="btn btn-danger" id="clearFiltersBtn">Clear Filters</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Filters offcanvas (mobile) -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="filterCanvas">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title"><i class="bi bi-funnel"></i> Filters</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <div class="filter-panel" id="filterPanelMobile"></div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="appToast" class="toast align-items-center text-bg-dark border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="toastMsg">Done!</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/store.js"></script>
    <script src="js/results.js"></script>
</body>
</html>
