<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotels | redBus</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="results-page">

    <nav class="navbar navbar-expand-lg fixed-top navbar-custom scrolled">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-bus-front-fill"></i> red<span>Bus</span></a>
            <div class="ms-auto d-flex align-items-center gap-2">
                <a class="btn btn-outline-light btn-sm px-3" href="index.html"><i class="bi bi-house"></i> Home</a>
                <a class="btn btn-outline-light btn-sm px-3" href="account.html"><i class="bi bi-ticket-perforated"></i> My Bookings</a>
                <span data-auth-nav></span>
            </div>
        </div>
    </nav>

    <!-- Modify search strip -->
    <section class="search-bar-strip">
        <div class="container">
            <form id="hotelModifyForm" class="row g-2 align-items-end">
                <div class="col-12 col-lg-4">
                    <label class="form-label"><i class="bi bi-geo-alt-fill text-danger"></i> City</label>
                    <input type="text" class="form-control" id="hCity" list="cityList" required>
                </div>
                <div class="col-6 col-lg-3">
                    <label class="form-label"><i class="bi bi-calendar-check-fill text-danger"></i> Check-in</label>
                    <input type="date" class="form-control" id="hCheckin" required>
                </div>
                <div class="col-6 col-lg-3">
                    <label class="form-label"><i class="bi bi-calendar-x-fill text-danger"></i> Check-out</label>
                    <input type="date" class="form-control" id="hCheckout" required>
                </div>
                <div class="col-12 col-lg-2 d-grid">
                    <button type="submit" class="btn btn-search"><i class="bi bi-search"></i> Search</button>
                </div>
                <datalist id="cityList">
                    <option value="Delhi"></option><option value="Mumbai"></option>
                    <option value="Bangalore"></option><option value="Hyderabad"></option>
                    <option value="Chennai"></option><option value="Pune"></option>
                    <option value="Kolkata"></option><option value="Goa"></option>
                    <option value="Jaipur"></option><option value="Manali"></option>
                    <option value="Shimla"></option><option value="Rishikesh"></option>
                </datalist>
            </form>
        </div>
    </section>

    <main class="results-main">
        <div class="container">
            <div class="mb-3">
                <h1 class="results-title mb-0" id="hotelHeading">Hotels</h1>
                <p class="text-muted mb-0" id="hotelMeta">Loading hotels...</p>
            </div>
            <div class="row g-4" id="hotelList"></div>
        </div>
    </main>

    <!-- Hotel booking modal -->
    <div class="modal fade" id="hotelBookModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold" id="hbTitle">Book Hotel</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="hbSummary" class="mb-3"></div>
                    <div class="row g-3">
                        <div class="col-6">
                            <label class="form-label">Rooms</label>
                            <select class="form-select" id="hbRooms">
                                <option value="1">1 Room</option>
                                <option value="2">2 Rooms</option>
                                <option value="3">3 Rooms</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Guests</label>
                            <select class="form-select" id="hbGuests">
                                <option value="1">1 Guest</option>
                                <option value="2">2 Guests</option>
                                <option value="3">3 Guests</option>
                                <option value="4">4 Guests</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Room Type</label>
                            <select class="form-select" id="hbRoomType">
                                <option value="Standard">Standard Room</option>
                                <option value="Deluxe">Deluxe Room (+₹800)</option>
                                <option value="Suite">Suite (+₹2000)</option>
                            </select>
                        </div>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between fare-total">
                        <span>Total</span><span id="hbTotal">₹0</span>
                    </div>
                    <button class="btn btn-search w-100 mt-3" id="hbConfirm"><i class="bi bi-shield-lock"></i> Confirm Booking</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="appToast" class="toast align-items-center text-bg-dark border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="toastMsg">Done!</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/store.js"></script>
    <script src="js/hotels.js"></script>
</body>
</html>
