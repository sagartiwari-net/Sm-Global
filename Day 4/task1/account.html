<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings | redBus</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="results-page">

    <nav class="navbar navbar-expand-lg fixed-top navbar-custom scrolled">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-bus-front-fill"></i> red<span>Bus</span></a>
            <div class="ms-auto d-flex align-items-center gap-2">
                <a class="btn btn-outline-light btn-sm px-3" href="index.html"><i class="bi bi-house"></i> Home</a>
                <span data-auth-nav></span>
            </div>
        </div>
    </nav>

    <section class="account-hero">
        <div class="container">
            <div id="profileBox"></div>
        </div>
    </section>

    <main class="results-main pt-4">
        <div class="container">
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
                <div>
                    <h1 class="results-title mb-0">My Bookings</h1>
                    <p class="text-muted mb-0" id="bookingMeta"></p>
                </div>
                <ul class="nav nav-pills booking-filter-tabs" id="filterTabs">
                    <li class="nav-item"><button class="nav-link active" data-filter="all">All</button></li>
                    <li class="nav-item"><button class="nav-link" data-filter="bus">Bus</button></li>
                    <li class="nav-item"><button class="nav-link" data-filter="train">Train</button></li>
                    <li class="nav-item"><button class="nav-link" data-filter="hotel">Hotel</button></li>
                </ul>
            </div>

            <div id="bookingList" class="booking-list"></div>

            <div id="emptyBookings" class="no-results d-none">
                <i class="bi bi-ticket-perforated"></i>
                <h4>No bookings yet</h4>
                <p class="text-muted">Search and book a bus, train, or hotel to see it here.</p>
                <a href="index.html" class="btn btn-danger">Start Booking</a>
            </div>
        </div>
    </main>

    <!-- Booking detail modal -->
    <div class="modal fade" id="detailModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content" id="detailContent"></div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="appToast" class="toast align-items-center text-bg-dark border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="toastMsg">Done!</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/store.js"></script>
    <script src="js/account.js"></script>
</body>
</html>
